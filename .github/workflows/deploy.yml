name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; no cancelar uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build estático (next export con basePath /3maps)
        run: npm run build
        env:
          NEXT_PUBLIC_PAGES: "1"
      - run: touch out/.nojekyll
      # NOTA: hay que habilitar Pages una vez a mano — repo → Settings → Pages →
      # Source = "GitHub Actions". El GITHUB_TOKEN no puede crear el sitio de
      # Pages ("Resource not accessible by integration"), así que `enablement`
      # no sirve acá. Una vez habilitado, este paso solo hace un GET y anda.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
